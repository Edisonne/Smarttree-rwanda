name: Build SmartTree Rwanda Android APK
on:
workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract project
        run: |
          mkdir app
          unzip smarttree-source.zip -d app

      - name: Generate Android files
        working-directory: app
        run: flutter create --platforms=android .

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Run tests
        working-directory: app
        run: flutter test

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smarttree-rwanda-android-apk
      - path: app/build/app/outputs/flutter-apk/app-release.apk          if-no-files-found: error
          
